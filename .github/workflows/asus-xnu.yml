name: asus-xnu

on:
  workflow_dispatch:
    inputs:
      hfs:
        description: Include HFS+ for a filesystem RAM root
        type: boolean
        default: false
      display:
        description: Include ASUS boot framebuffer presentation (requires HFS+)
        type: boolean
        default: false
      compositor:
        description: Include the QEMU compositor signature policy (requires display)
        type: boolean
        default: false
      userland:
        description: Include iOS daemon support (Sandbox stand-in, rootrw, rename swap; requires HFS+)
        type: boolean
        default: false
      ufs:
        description: Include the UFS driver (writes only to iosroot with ufsrw=1; requires HFS+)
        type: boolean
        default: false
      input:
        description: Include HID touch/button services and the QEMU virtio input source (requires HFS+)
        type: boolean
        default: false
      smp:
        description: Include SMP via PSCI CPU_ON (boot-arg cpus=N, N <= 8)
        type: boolean
        default: false
      amp:
        description: With smp, A55 E cluster + A78/X1 P cluster (images built with ASUS_AMP=1)
        type: boolean
        default: false
      gpu:
        description: Include RedwoodGPU for Mesa on the Adreno 660 (requires display and input; boot-arg asusgpu=10)
        type: boolean
        default: false
      runner:
        description: Runner label (macos-15 = arm64; macos-15-intel when arm64 runners have no capacity)
        default: macos-15

permissions:
  contents: read

concurrency:
  group: asus-xnu-${{ github.ref }}
  cancel-in-progress: false   # queue: a new dispatch must not kill a build a phone test waits for

env:
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET

jobs:
  build:
    # macos-14 was retired on 2026-11-02 (jobs fail: "configuration ... not supported").
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned minimal ASUS profile
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          args=()
          if [ '${{ inputs.hfs }}' = true ]; then args+=(--hfs); fi
          if [ '${{ inputs.display }}' = true ]; then args+=(--display); fi
          if [ '${{ inputs.compositor }}' = true ]; then args+=(--compositor); fi
          if [ '${{ inputs.userland }}' = true ]; then args+=(--userland); fi
          if [ '${{ inputs.input }}' = true ]; then args+=(--input); fi
          if [ '${{ inputs.ufs }}' = true ]; then args+=(--ufs); fi
          if [ '${{ inputs.smp }}' = true ]; then args+=(--smp); fi
          if [ '${{ inputs.amp }}' = true ]; then args+=(--amp); fi
          if [ '${{ inputs.gpu }}' = true ]; then args+=(--gpu); fi
          python3 tools/prepare-asus-profile.py dxb "${args[@]}"
      - name: Select matching Xcode and dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          # Xcode 15 as on macos-14 when the image has one, else the oldest Xcode 16.
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_16*.app | sort -V | head -1)
          test -n "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build XNU
        working-directory: dxb
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../asus-build.log
      - name: Verify ASUS kernel
        run: |
          mkdir -p out
          cp dxb/fakeroot/System/Library/Kernels/kernel.development.sweet out/
          cp dxb/asus-profile.json out/
          args=()
          if [ '${{ inputs.hfs }}' = true ]; then args+=(--require-hfs); fi
          if [ '${{ inputs.display }}' = true ]; then args+=(--require-display); fi
          if [ '${{ inputs.compositor }}' = true ]; then args+=(--require-compositor); fi
          if [ '${{ inputs.userland }}' = true ]; then args+=(--require-userland); fi
          if [ '${{ inputs.input }}' = true ]; then args+=(--require-input); fi
          if [ '${{ inputs.ufs }}' = true ]; then args+=(--require-ufs-read-only); fi
          python3 tools/verify-asus-kernel.py out/kernel.development.sweet "${args[@]}" > out/asus-kernel.json
          (cd out && shasum -a 256 kernel.development.sweet > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xnu-asus-kernel
          path: out/
          if-no-files-found: error
      - name: Package generated build tree
        if: always()
        run: |
          if [ -d dxb/build/xnu.obj ]; then
            tar czf asus-buildtree.tgz --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' --exclude='.git' -C dxb build/xnu.obj xnu fakeroot/usr/local/include
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-asus-build-log
          path: |
            asus-build.log
            asus-buildtree.tgz
          retention-days: 7
