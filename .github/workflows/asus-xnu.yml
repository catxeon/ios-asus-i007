name: asus-xnu

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asus-xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned minimal ASUS profile
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          python3 tools/prepare-asus-profile.py dxb
      - name: Select matching Xcode and dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_15*.app | sort -V | head -1)
          test -n "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build XNU
        working-directory: dxb
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../asus-build.log
      - name: Verify ASUS kernel
        run: |
          mkdir -p out
          cp dxb/fakeroot/System/Library/Kernels/kernel.development.sweet out/
          cp dxb/asus-profile.json out/
          python3 tools/verify-asus-kernel.py out/kernel.development.sweet > out/asus-kernel.json
          (cd out && shasum -a 256 kernel.development.sweet > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xnu-asus-kernel
          path: out/
          if-no-files-found: error
      - name: Package generated build tree
        if: always()
        run: |
          if [ -d dxb/build/xnu.obj ]; then
            tar czf asus-buildtree.tgz --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' --exclude='.git' -C dxb build/xnu.obj xnu fakeroot/usr/local/include
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-asus-build-log
          path: |
            asus-build.log
            asus-buildtree.tgz
          retention-days: 7
